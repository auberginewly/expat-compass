name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 前端构建
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Build frontend
        working-directory: ./frontend
        run: |
          pnpm install
          pnpm build
      
      # 后端构建
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests
      
      # 部署
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy frontend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          cd frontend/dist
          tar czf - . | ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "mkdir -p ~/frontend-tmp && cd ~/frontend-tmp && tar xzf -"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "sudo mkdir -p /www/wwwroot/expat-compass/frontend && \
             sudo rm -rf /www/wwwroot/expat-compass/frontend/* && \
             sudo mv ~/frontend-tmp/* /www/wwwroot/expat-compass/frontend/ && \
             sudo chown -R www:www /www/wwwroot/expat-compass/frontend && \
             rm -rf ~/frontend-tmp"
      
      - name: Deploy backend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          JAR_FILE=$(find backend/target -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          scp -P "$PORT" -o StrictHostKeyChecking=no "$JAR_FILE" "$SERVER:~/app.jar"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "BACKEND_DIR=/www/wwwroot/expat-compass/backend && \
             sudo mkdir -p \$BACKEND_DIR/logs \$BACKEND_DIR/tmp && \
             sudo mv ~/app.jar \$BACKEND_DIR/app.jar && \
             sudo chown -R www:www \$BACKEND_DIR && \
             sudo chmod 755 \$BACKEND_DIR/app.jar"
      
      - name: Restart backend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "sudo pkill -f 'java.*app.jar' || true && \
             sleep 2 && \
             cd /www/wwwroot/expat-compass/backend && \
             sudo -u www nohup java -Xms512m -Xmx1024m \
               -Dspring.profiles.active=prod \
               -Djava.io.tmpdir=/www/wwwroot/expat-compass/backend/tmp \
               -jar app.jar > logs/app.log 2>&1 &"
      
      - name: Health check
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" bash -c "
            for i in {1..12}; do
              if curl -f -s http://localhost:8080/api/health > /dev/null 2>&1; then
                echo '✅ Health check passed'
                exit 0
              fi
              sleep 5
            done
            echo '❌ Health check failed'
            exit 1
          "

