name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 前端构建
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Build frontend
        working-directory: ./frontend
        run: |
          pnpm install
          pnpm build
      
      # 后端构建
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      
      - name: Build backend
        working-directory: ./backend
        run: ./mvnw package -DskipTests
      
      # 部署
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy frontend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          cd frontend/dist
          tar czf - . | ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "mkdir -p ~/frontend-tmp && cd ~/frontend-tmp && tar xzf -"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "sudo mkdir -p /www/wwwroot/expat-compass/frontend && \
             sudo rm -rf /www/wwwroot/expat-compass/frontend/* && \
             sudo mv ~/frontend-tmp/* /www/wwwroot/expat-compass/frontend/ && \
             sudo chown -R www:www /www/wwwroot/expat-compass/frontend && \
             rm -rf ~/frontend-tmp"
      
      - name: Deploy backend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          SSH_OPTS="-p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          SCP_OPTS="-P $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 -C"
          
          JAR_FILE=$(find backend/target -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          
          JAR_SIZE=$(du -h "$JAR_FILE" | cut -f1)
          echo "📦 Uploading JAR file ($JAR_SIZE) with compression..."
          
          # 使用压缩传输，然后合并所有服务器端操作为一个 SSH 命令
          scp $SCP_OPTS "$JAR_FILE" "$SERVER:~/app.jar.tmp" && \
          ssh $SSH_OPTS "$SERVER" bash -c "
            BACKEND_DIR=/www/wwwroot/expat-compass/backend
            sudo mkdir -p \$BACKEND_DIR/logs \$BACKEND_DIR/tmp
            sudo mv ~/app.jar.tmp \$BACKEND_DIR/app.jar
            sudo chown -R www:www \$BACKEND_DIR
            sudo chmod 755 \$BACKEND_DIR/app.jar
            echo '✅ Backend deployed successfully'
          "
      
      - name: Restart backend
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" \
            "sudo pkill -f 'java.*app.jar' || true && \
             sleep 2 && \
             cd /www/wwwroot/expat-compass/backend && \
             sudo -u www nohup java -Xms512m -Xmx1024m \
               -Dspring.profiles.active=prod \
               -Djava.io.tmpdir=/www/wwwroot/expat-compass/backend/tmp \
               -jar app.jar > logs/app.log 2>&1 &"
      
      - name: Health check
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          ssh -p "$PORT" -o StrictHostKeyChecking=no "$SERVER" bash -c "
            echo '⏳ Waiting for application to start...'
            for i in {1..8}; do
              if curl -f -s http://localhost:8080/api/health > /dev/null 2>&1; then
                echo \"✅ Health check passed (attempt \$i/8)\"
                exit 0
              fi
              echo \"   [\$i/8] Checking...\"
              sleep 3
            done
            echo '❌ Health check failed after 24 seconds'
            echo '📋 Checking application logs...'
            tail -n 50 /www/wwwroot/expat-compass/backend/logs/app.log || echo 'Log file not found'
            exit 1
          "

