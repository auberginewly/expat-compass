name: Deploy to Baota Panel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 构建前端
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # 如果 lockfile 存在，使用 frozen-lockfile；否则正常安装
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build
        # 注意：同域部署时，前端使用相对路径 /api，无需设置 VITE_API_BASE_URL

      # 构建后端
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # 部署到服务器
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          echo "🔍 Debug: SERVER_HOST length: ${#SERVER_HOST}"
          echo "🔍 Debug: SERVER_PORT: ${SERVER_PORT}"
          echo "🔍 Debug: SERVER_HOST format check..."
          if [[ ! "${SERVER_HOST}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "⚠️  Warning: SERVER_HOST may not be a valid IP address format"
            echo "⚠️  Current value (first 10 chars): ${SERVER_HOST:0:10}..."
          else
            echo "✅ SERVER_HOST format looks correct"
          fi
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>&1 || true

      - name: Create deployment directories
        run: |
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          echo "🔍 ===== 配置验证 ====="
          if [ -z "${SERVER_HOST}" ]; then
            echo "❌ Error: SERVER_HOST secret is not set"
            exit 1
          fi
          
          if [ -z "${SERVER_USER}" ]; then
            echo "❌ Error: SERVER_USER secret is not set"
            exit 1
          fi
          
          echo "✅ SERVER_HOST: ${SERVER_HOST}"
          echo "✅ SERVER_USER: ${SERVER_USER}"
          echo "✅ SERVER_PORT: ${SERVER_PORT}"
          
          # 严格验证 IP 格式
          echo ""
          echo "🔍 验证 SERVER_HOST 格式..."
          if [[ "${SERVER_HOST}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            # 验证每个数字段
            IFS='.' read -ra ADDR <<< "${SERVER_HOST}"
            VALID=true
            for i in "${ADDR[@]}"; do
              if [[ $i -lt 0 ]] || [[ $i -gt 255 ]]; then
                echo "❌ 错误：数字段 $i 不在有效范围内 (0-255)"
                VALID=false
              fi
            done
            if [ "$VALID" = true ]; then
              echo "✅ SERVER_HOST 格式正确: ${SERVER_HOST}"
            else
              echo "❌ SERVER_HOST 格式错误"
              exit 1
            fi
          else
            echo "❌ 错误：SERVER_HOST 不是有效的 IPv4 格式"
            echo "   当前值: ${SERVER_HOST}"
            echo "   正确格式应该是: xxx.xxx.xxx.xxx (例如: 43.143.124.38)"
            echo "   请检查 GitHub Secrets 中的 SERVER_HOST 值"
            exit 1
          fi
          
          echo ""
          echo "🔍 正在连接到 ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            # 使用 sudo 创建目录（ubuntu 用户需要 sudo 权限）
            sudo mkdir -p /www/wwwroot/expat-compass/{frontend,backend/uploads,backend/logs,backend/tmp} || mkdir -p /www/wwwroot/expat-compass/{frontend,backend/uploads,backend/logs,backend/tmp}
            # 设置权限
            sudo chown -R www:www /www/wwwroot/expat-compass 2>/dev/null || chown -R www:www /www/wwwroot/expat-compass 2>/dev/null || true
            # 确保临时目录有写权限
            sudo chmod 777 /www/wwwroot/expat-compass/backend/tmp 2>/dev/null || chmod 777 /www/wwwroot/expat-compass/backend/tmp 2>/dev/null || true
          EOF

      - name: Deploy frontend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          # 清空旧文件（保留 .htaccess 等配置文件）
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" "sudo rm -rf /www/wwwroot/expat-compass/frontend/* || rm -rf /www/wwwroot/expat-compass/frontend/*"
          # 创建临时目录（使用用户主目录，避免 /tmp 权限问题）
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ~/expat-compass-frontend && rm -rf ~/expat-compass-frontend/*"
          # 上传新文件到临时目录
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r frontend/dist/* "${SERVER_USER}@${SERVER_HOST}:~/expat-compass-frontend/"
          # 移动文件到目标目录并设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            sudo mv ~/expat-compass-frontend/* /www/wwwroot/expat-compass/frontend/ 2>/dev/null || mv ~/expat-compass-frontend/* /www/wwwroot/expat-compass/frontend/
            sudo chown -R www:www /www/wwwroot/expat-compass/frontend 2>/dev/null || chown -R www:www /www/wwwroot/expat-compass/frontend 2>/dev/null || true
            rm -rf ~/expat-compass-frontend
          EOF

      - name: Deploy backend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          
          # 检查 JAR 文件是否存在
          JAR_FILE=$(find backend/target -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ Error: JAR file not found in backend/target/"
            echo "Available files:"
            ls -la backend/target/ || true
            exit 1
          fi
          echo "✅ Found JAR file: $JAR_FILE"
          
          # 备份旧版本
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            if [ -f /www/wwwroot/expat-compass/backend/app.jar ]; then
              sudo cp /www/wwwroot/expat-compass/backend/app.jar /www/wwwroot/expat-compass/backend/app.jar.backup.$(date +%Y%m%d%H%M%S) 2>/dev/null || \
              cp /www/wwwroot/expat-compass/backend/app.jar /www/wwwroot/expat-compass/backend/app.jar.backup.$(date +%Y%m%d%H%M%S)
            fi
          EOF
          
          # 上传新 JAR 到用户主目录（避免 /tmp 权限问题）
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$JAR_FILE" "${SERVER_USER}@${SERVER_HOST}:~/app.jar"
          
          # 移动文件到目标目录并设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            if [ ! -f ~/app.jar ]; then
              echo "❌ Error: app.jar not found in home directory"
              exit 1
            fi
            sudo mv ~/app.jar /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || mv ~/app.jar /www/wwwroot/expat-compass/backend/app.jar
            if [ ! -f /www/wwwroot/expat-compass/backend/app.jar ]; then
              echo "❌ Error: Failed to move app.jar to target directory"
              exit 1
            fi
            # 设置文件权限（可执行）
            sudo chmod 755 /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || chmod 755 /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || true
            sudo chown www:www /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || chown www:www /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || true
            echo "✅ JAR file deployed successfully"
            ls -lh /www/wwwroot/expat-compass/backend/app.jar || true
            rm -f ~/app.jar
          EOF

      - name: Restart backend service
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            # 如果使用 systemd 服务
            if sudo systemctl is-active --quiet expat-compass 2>/dev/null || systemctl is-active --quiet expat-compass 2>/dev/null; then
              echo "Restarting via systemd..."
              sudo systemctl restart expat-compass
              sleep 3
              sudo systemctl status expat-compass --no-pager || true
            else
              # 否则使用进程管理
              echo "Stopping old process..."
              sudo pkill -f "java.*app.jar" || pkill -f "java.*app.jar" || true
              sleep 2
              
              # 检查并安装 Java 环境
              echo "Checking Java installation..."
              if ! command -v java &> /dev/null; then
                echo "Java not found, installing OpenJDK 17..."
                # 更新包列表，忽略部分包的404错误
                sudo apt-get update -qq || true
                # 尝试安装，如果失败则尝试修复
                if ! sudo apt-get install -y openjdk-17-jdk; then
                  echo "⚠️  First install attempt failed, trying with --fix-missing..."
                  sudo apt-get install -y --fix-missing openjdk-17-jdk || {
                    echo "⚠️  Install with --fix-missing failed, trying alternative method..."
                    # 尝试只安装 JRE
                    sudo apt-get install -y openjdk-17-jre || {
                      echo "❌ Failed to install Java. Trying to find existing Java installation..."
                      # 查找系统中可能存在的 Java
                      if [ -d /usr/lib/jvm ]; then
                        echo "Found Java installations in /usr/lib/jvm:"
                        ls -la /usr/lib/jvm/ || true
                        # 尝试使用找到的 Java
                        for java_dir in /usr/lib/jvm/*/bin/java; do
                          if [ -x "$java_dir" ]; then
                            echo "Using found Java: $java_dir"
                            sudo ln -sf "$java_dir" /usr/local/bin/java || true
                            break
                          fi
                        done
                      fi
                    }
                  }
                fi
              fi
              
              # 再次检查 Java
              if ! command -v java &> /dev/null; then
                # 尝试查找 Java 的完整路径
                JAVA_PATHS=(
                  "/usr/bin/java"
                  "/usr/lib/jvm/java-17-openjdk-amd64/bin/java"
                  "/usr/lib/jvm/java-17-openjdk/bin/java"
                  "/usr/lib/jvm/default-java/bin/java"
                )
                JAVA_CMD=""
                for path in "${JAVA_PATHS[@]}"; do
                  if [ -x "$path" ]; then
                    JAVA_CMD="$path"
                    echo "✅ Found Java at: $JAVA_CMD"
                    break
                  fi
                done
                
                if [ -z "$JAVA_CMD" ]; then
                  echo "❌ Error: Java not found and installation failed"
                  echo "Please install Java manually: sudo apt-get install -y openjdk-17-jdk"
                  exit 1
                fi
              else
                JAVA_CMD=$(which java)
              fi
              
              # 验证 Java 版本
              JAVA_VERSION=$("$JAVA_CMD" -version 2>&1 | head -n 1 || echo "")
              echo "Java version: $JAVA_VERSION"
              echo "Using Java: $JAVA_CMD"
              
              echo "Starting new process..."
              cd /www/wwwroot/expat-compass/backend || { echo "❌ Error: Cannot cd to backend directory"; exit 1; }
              
              # 检查 app.jar 是否存在
              if [ ! -f app.jar ]; then
                echo "❌ Error: app.jar not found in /www/wwwroot/expat-compass/backend/"
                ls -la /www/wwwroot/expat-compass/backend/ || true
                exit 1
              fi
              echo "✅ Found app.jar: $(ls -lh app.jar)"
              
              # 确保 logs 目录存在并有写权限
              sudo mkdir -p logs || mkdir -p logs
              sudo chmod 777 logs || chmod 777 logs  # 临时放宽权限以确保可以写入
              # 删除旧的日志文件（如果存在）
              sudo rm -f logs/app.log || rm -f logs/app.log
              # 创建日志文件并设置权限（使用 sudo -u www 创建，确保所有者正确）
              sudo -u www touch logs/app.log 2>/dev/null || touch logs/app.log
              # 设置权限，确保 www 用户可以写入
              sudo chmod 666 logs/app.log 2>/dev/null || chmod 666 logs/app.log 2>/dev/null || true
              sudo chown www:www logs/app.log 2>/dev/null || chown www:www logs/app.log 2>/dev/null || true
              # 验证文件是否创建成功
              if [ ! -f logs/app.log ]; then
                echo "⚠️  Warning: Failed to create log file, will try to create during startup"
              else
                echo "✅ Log file created: $(ls -lh logs/app.log)"
              fi
              
              # 使用绝对路径
              LOG_FILE="/www/wwwroot/expat-compass/backend/logs/app.log"
              JAR_FILE="/www/wwwroot/expat-compass/backend/app.jar"
              
              # 检查端口是否被占用
              if lsof -i :8080 > /dev/null 2>&1; then
                echo "⚠️  Warning: Port 8080 is already in use"
                lsof -i :8080 || true
              fi
              
              # 确保日志文件存在且可写
              if [ ! -f "$LOG_FILE" ]; then
                sudo -u www touch "$LOG_FILE" 2>/dev/null || touch "$LOG_FILE"
                sudo chmod 666 "$LOG_FILE" 2>/dev/null || chmod 666 "$LOG_FILE" 2>/dev/null || true
                sudo chown www:www "$LOG_FILE" 2>/dev/null || chown www:www "$LOG_FILE" 2>/dev/null || true
              fi
              
              # 创建应用专用的临时目录（避免 /tmp 权限问题）
              APP_TMP_DIR="/www/wwwroot/expat-compass/backend/tmp"
              sudo mkdir -p "$APP_TMP_DIR" || mkdir -p "$APP_TMP_DIR"
              sudo chmod 777 "$APP_TMP_DIR" || chmod 777 "$APP_TMP_DIR"
              sudo chown www:www "$APP_TMP_DIR" 2>/dev/null || chown www:www "$APP_TMP_DIR" 2>/dev/null || true
              echo "✅ Created temp directory: $APP_TMP_DIR"
              
              # 尝试使用 sudo -u www 启动
              echo "Starting with: $JAVA_CMD -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod -Djava.io.tmpdir=$APP_TMP_DIR $JAR_FILE"
              # 切换到日志目录，确保可以写入
              cd /www/wwwroot/expat-compass/backend
              sudo -u www bash -c "cd /www/wwwroot/expat-compass/backend && nohup $JAVA_CMD -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod -Djava.io.tmpdir=$APP_TMP_DIR $JAR_FILE > $LOG_FILE 2>&1 &" || {
                echo "Failed with sudo -u www, trying without sudo..."
                nohup "$JAVA_CMD" -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod -Djava.io.tmpdir="$APP_TMP_DIR" "$JAR_FILE" > "$LOG_FILE" 2>&1 &
              }
              # 等待一下，检查是否启动成功
              sleep 2
              sleep 2
              if ! pgrep -f "java.*app.jar" > /dev/null; then
                echo "Process not found, checking if it started..."
                # 如果进程不存在，尝试不使用 sudo 启动
                sudo chmod 666 "$LOG_FILE" 2>/dev/null || chmod 666 "$LOG_FILE" 2>/dev/null || true
                # 确保临时目录存在
                APP_TMP_DIR="/www/wwwroot/expat-compass/backend/tmp"
                mkdir -p "$APP_TMP_DIR" || true
                chmod 777 "$APP_TMP_DIR" || true
                echo "Starting without sudo: $JAVA_CMD -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod -Djava.io.tmpdir=$APP_TMP_DIR $JAR_FILE"
                cd /www/wwwroot/expat-compass/backend
                nohup "$JAVA_CMD" -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod -Djava.io.tmpdir="$APP_TMP_DIR" "$JAR_FILE" > "$LOG_FILE" 2>&1 &
                sleep 3
              fi
              sleep 3
              
              # 检查是否启动成功
              sleep 2
              if pgrep -f "java.*app.jar" > /dev/null; then
                echo "✅ Backend service started successfully"
                echo "Process info:"
                ps aux | grep "java.*app.jar" | grep -v grep || true
                echo "Port 8080 status:"
                lsof -i :8080 || netstat -tlnp | grep 8080 || true
              else
                echo "❌ Backend service failed to start"
                echo "Checking log file..."
                if [ -f "$LOG_FILE" ]; then
                  echo "=== Last 30 lines of log ==="
                  tail -30 "$LOG_FILE"
                else
                  echo "Log file not found at: $LOG_FILE"
                fi
                echo ""
                echo "Checking Java processes..."
                ps aux | grep java | grep -v grep || echo "No Java processes found"
                echo ""
                echo "Checking directory structure..."
                ls -la /www/wwwroot/expat-compass/backend/ || true
                echo ""
                echo "Checking file permissions..."
                ls -lh /www/wwwroot/expat-compass/backend/app.jar || true
                echo ""
                echo "Testing Java execution..."
                "$JAVA_CMD" -version || true
                exit 1
              fi
            fi
          EOF

      - name: Health check
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "Waiting for service to start..."
            sleep 10
            
            # 健康检查
            for i in {1..10}; do
              if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/10: Service not ready, waiting..."
              sleep 3
            done
            
            echo "❌ Health check failed"
            tail -30 /www/wwwroot/expat-compass/backend/logs/app.log || true
            exit 1
          EOF

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Frontend: http://${{ secrets.SERVER_HOST }}"
          echo "Backend API: http://${{ secrets.SERVER_HOST }}/api"

