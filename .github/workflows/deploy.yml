name: Deploy to Baota Panel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 构建前端
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # 如果 lockfile 存在，使用 frozen-lockfile；否则正常安装
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build
        # 注意：同域部署时，前端使用相对路径 /api，无需设置 VITE_API_BASE_URL

      # 构建后端
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # 部署到服务器
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          echo "🔍 Debug: SERVER_HOST length: ${#SERVER_HOST}"
          echo "🔍 Debug: SERVER_PORT: ${SERVER_PORT}"
          echo "🔍 Debug: SERVER_HOST format check..."
          if [[ ! "${SERVER_HOST}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "⚠️  Warning: SERVER_HOST may not be a valid IP address format"
            echo "⚠️  Current value (first 10 chars): ${SERVER_HOST:0:10}..."
          else
            echo "✅ SERVER_HOST format looks correct"
          fi
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>&1 || true

      - name: Create deployment directories
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "❌ Error: SERVER_HOST secret is not set"
            exit 1
          fi
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          echo "🔍 Debug: Connecting to ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${SERVER_PORT}"
          echo "🔍 Debug: SERVER_HOST format check..."
          if [[ ! "${{ secrets.SERVER_HOST }}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "⚠️  Warning: SERVER_HOST may not be a valid IP address format"
          fi
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            mkdir -p /www/wwwroot/expat-compass/{frontend,backend/uploads,backend/logs}
            chown -R www:www /www/wwwroot/expat-compass
          EOF

      - name: Deploy frontend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          # 清空旧文件（保留 .htaccess 等配置文件）
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "rm -rf /www/wwwroot/expat-compass/frontend/*"
          # 上传新文件
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/www/wwwroot/expat-compass/frontend/
          # 设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chown -R www:www /www/wwwroot/expat-compass/frontend"

      - name: Deploy backend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          # 备份旧版本
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            if [ -f /www/wwwroot/expat-compass/backend/app.jar ]; then
              cp /www/wwwroot/expat-compass/backend/app.jar /www/wwwroot/expat-compass/backend/app.jar.backup.$(date +%Y%m%d%H%M%S)
            fi
          EOF
          # 上传新 JAR
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null backend/target/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/www/wwwroot/expat-compass/backend/app.jar
          # 设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chown www:www /www/wwwroot/expat-compass/backend/app.jar"

      - name: Restart backend service
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            # 如果使用 systemd 服务
            if systemctl is-active --quiet expat-compass 2>/dev/null; then
              echo "Restarting via systemd..."
              sudo systemctl restart expat-compass
              sleep 3
              sudo systemctl status expat-compass --no-pager || true
            else
              # 否则使用进程管理
              echo "Stopping old process..."
              pkill -f "java.*app.jar" || true
              sleep 2
              
              echo "Starting new process..."
              cd /www/wwwroot/expat-compass/backend
              nohup java -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod app.jar > logs/app.log 2>&1 &
              sleep 5
              
              # 检查是否启动成功
              if pgrep -f "java.*app.jar" > /dev/null; then
                echo "✅ Backend service started successfully"
              else
                echo "❌ Backend service failed to start"
                tail -20 logs/app.log
                exit 1
              fi
            fi
          EOF

      - name: Health check
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "Waiting for service to start..."
            sleep 10
            
            # 健康检查
            for i in {1..10}; do
              if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/10: Service not ready, waiting..."
              sleep 3
            done
            
            echo "❌ Health check failed"
            tail -30 /www/wwwroot/expat-compass/backend/logs/app.log || true
            exit 1
          EOF

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Frontend: http://${{ secrets.SERVER_HOST }}"
          echo "Backend API: http://${{ secrets.SERVER_HOST }}/api"

