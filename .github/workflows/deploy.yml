name: Deploy to Baota Panel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 构建前端
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # 如果 lockfile 存在，使用 frozen-lockfile；否则正常安装
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build
        # 注意：同域部署时，前端使用相对路径 /api，无需设置 VITE_API_BASE_URL

      # 构建后端
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # 部署到服务器
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          echo "🔍 Debug: SERVER_HOST length: ${#SERVER_HOST}"
          echo "🔍 Debug: SERVER_PORT: ${SERVER_PORT}"
          echo "🔍 Debug: SERVER_HOST format check..."
          if [[ ! "${SERVER_HOST}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "⚠️  Warning: SERVER_HOST may not be a valid IP address format"
            echo "⚠️  Current value (first 10 chars): ${SERVER_HOST:0:10}..."
          else
            echo "✅ SERVER_HOST format looks correct"
          fi
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>&1 || true

      - name: Create deployment directories
        run: |
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          
          echo "🔍 ===== 配置验证 ====="
          if [ -z "${SERVER_HOST}" ]; then
            echo "❌ Error: SERVER_HOST secret is not set"
            exit 1
          fi
          
          if [ -z "${SERVER_USER}" ]; then
            echo "❌ Error: SERVER_USER secret is not set"
            exit 1
          fi
          
          echo "✅ SERVER_HOST: ${SERVER_HOST}"
          echo "✅ SERVER_USER: ${SERVER_USER}"
          echo "✅ SERVER_PORT: ${SERVER_PORT}"
          
          # 严格验证 IP 格式
          echo ""
          echo "🔍 验证 SERVER_HOST 格式..."
          if [[ "${SERVER_HOST}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            # 验证每个数字段
            IFS='.' read -ra ADDR <<< "${SERVER_HOST}"
            VALID=true
            for i in "${ADDR[@]}"; do
              if [[ $i -lt 0 ]] || [[ $i -gt 255 ]]; then
                echo "❌ 错误：数字段 $i 不在有效范围内 (0-255)"
                VALID=false
              fi
            done
            if [ "$VALID" = true ]; then
              echo "✅ SERVER_HOST 格式正确: ${SERVER_HOST}"
            else
              echo "❌ SERVER_HOST 格式错误"
              exit 1
            fi
          else
            echo "❌ 错误：SERVER_HOST 不是有效的 IPv4 格式"
            echo "   当前值: ${SERVER_HOST}"
            echo "   正确格式应该是: xxx.xxx.xxx.xxx (例如: 43.143.124.38)"
            echo "   请检查 GitHub Secrets 中的 SERVER_HOST 值"
            exit 1
          fi
          
          echo ""
          echo "🔍 正在连接到 ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            # 使用 sudo 创建目录（ubuntu 用户需要 sudo 权限）
            sudo mkdir -p /www/wwwroot/expat-compass/{frontend,backend/uploads,backend/logs} || mkdir -p /www/wwwroot/expat-compass/{frontend,backend/uploads,backend/logs}
            # 设置权限
            sudo chown -R www:www /www/wwwroot/expat-compass 2>/dev/null || chown -R www:www /www/wwwroot/expat-compass 2>/dev/null || true
          EOF

      - name: Deploy frontend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          # 清空旧文件（保留 .htaccess 等配置文件）
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" "sudo rm -rf /www/wwwroot/expat-compass/frontend/* || rm -rf /www/wwwroot/expat-compass/frontend/*"
          # 创建临时目录（使用用户主目录，避免 /tmp 权限问题）
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ~/expat-compass-frontend && rm -rf ~/expat-compass-frontend/*"
          # 上传新文件到临时目录
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r frontend/dist/* "${SERVER_USER}@${SERVER_HOST}:~/expat-compass-frontend/"
          # 移动文件到目标目录并设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            sudo mv ~/expat-compass-frontend/* /www/wwwroot/expat-compass/frontend/ 2>/dev/null || mv ~/expat-compass-frontend/* /www/wwwroot/expat-compass/frontend/
            sudo chown -R www:www /www/wwwroot/expat-compass/frontend 2>/dev/null || chown -R www:www /www/wwwroot/expat-compass/frontend 2>/dev/null || true
            rm -rf ~/expat-compass-frontend
          EOF

      - name: Deploy backend
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          # 备份旧版本
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            if [ -f /www/wwwroot/expat-compass/backend/app.jar ]; then
              sudo cp /www/wwwroot/expat-compass/backend/app.jar /www/wwwroot/expat-compass/backend/app.jar.backup.$(date +%Y%m%d%H%M%S) 2>/dev/null || \
              cp /www/wwwroot/expat-compass/backend/app.jar /www/wwwroot/expat-compass/backend/app.jar.backup.$(date +%Y%m%d%H%M%S)
            fi
          EOF
          # 上传新 JAR 到用户主目录（避免 /tmp 权限问题）
          scp -P "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null backend/target/*.jar "${SERVER_USER}@${SERVER_HOST}:~/app.jar"
          # 移动文件到目标目录并设置权限
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            sudo mv ~/app.jar /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || mv ~/app.jar /www/wwwroot/expat-compass/backend/app.jar
            sudo chown www:www /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || chown www:www /www/wwwroot/expat-compass/backend/app.jar 2>/dev/null || true
            rm -f ~/app.jar
          EOF

      - name: Restart backend service
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SERVER_USER}@${SERVER_HOST}" << 'EOF'
            # 如果使用 systemd 服务
            if sudo systemctl is-active --quiet expat-compass 2>/dev/null || systemctl is-active --quiet expat-compass 2>/dev/null; then
              echo "Restarting via systemd..."
              sudo systemctl restart expat-compass
              sleep 3
              sudo systemctl status expat-compass --no-pager || true
            else
              # 否则使用进程管理
              echo "Stopping old process..."
              sudo pkill -f "java.*app.jar" || pkill -f "java.*app.jar" || true
              sleep 2
              
              echo "Starting new process..."
              cd /www/wwwroot/expat-compass/backend
              # 确保 logs 目录存在并有写权限
              sudo mkdir -p logs || mkdir -p logs
              sudo chmod 755 logs || chmod 755 logs
              # 创建日志文件并设置权限
              sudo touch logs/app.log || touch logs/app.log
              sudo chmod 644 logs/app.log || chmod 644 logs/app.log
              sudo chown www:www logs/app.log 2>/dev/null || chown www:www logs/app.log 2>/dev/null || true
              # 使用绝对路径
              LOG_FILE="/www/wwwroot/expat-compass/backend/logs/app.log"
              # 尝试使用 sudo -u www 启动
              sudo -u www nohup java -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod app.jar > "$LOG_FILE" 2>&1 &
              # 等待一下，检查是否启动成功
              sleep 2
              if ! pgrep -f "java.*app.jar" > /dev/null; then
                echo "Failed with sudo -u www, trying without sudo..."
                # 如果 sudo 失败，使用当前用户权限
                sudo chmod 666 logs/app.log 2>/dev/null || chmod 666 logs/app.log 2>/dev/null || true
                nohup java -jar -Xms512m -Xmx1024m -Dspring.profiles.active=prod app.jar > "$LOG_FILE" 2>&1 &
                sleep 2
              fi
              sleep 3
              
              # 检查是否启动成功
              if pgrep -f "java.*app.jar" > /dev/null; then
                echo "✅ Backend service started successfully"
              else
                echo "❌ Backend service failed to start"
                if [ -f "$LOG_FILE" ]; then
                  tail -20 "$LOG_FILE"
                else
                  echo "Log file not found, checking process..."
                  ps aux | grep java || true
                  echo "Checking directory permissions..."
                  ls -la /www/wwwroot/expat-compass/backend/logs/ || true
                fi
                exit 1
              fi
            fi
          EOF

      - name: Health check
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT || '22' }}"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "Waiting for service to start..."
            sleep 10
            
            # 健康检查
            for i in {1..10}; do
              if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/10: Service not ready, waiting..."
              sleep 3
            done
            
            echo "❌ Health check failed"
            tail -30 /www/wwwroot/expat-compass/backend/logs/app.log || true
            exit 1
          EOF

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Frontend: http://${{ secrets.SERVER_HOST }}"
          echo "Backend API: http://${{ secrets.SERVER_HOST }}/api"

